# Redraws fish/fish.gif every day: your contribution streak sets the fish's life
# stage (it becomes a dragon at 30 days), yesterday's contributions set its mood,
# and the pond follows the season. Some days bring a golden fish, a heron or a hook.
name: Fish

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fish.yml, fish/fish.py]

permissions:
  contents: write

concurrency: fish

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy
      - name: Draw today's fish
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: python fish/fish.py
      - name: Publish under a new name so image caches fetch it
        run: |
          name="fish/fish-$(date -u +%Y%m%d%H%M).gif"
          git rm -q --ignore-unmatch fish/fish-*.gif
          mv fish/fish.gif "$name"
          git rm -q --cached --ignore-unmatch fish/fish.gif
          sed -i -E 's#src="fish/fish[^"]*\.gif"#src="'"$name"'"#' README.md
          grep -q "$name" README.md
      - name: Commit
        run: |
          git add -A fish README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "fish: today's hunt"
          git pull --rebase --quiet
          git push --quiet
